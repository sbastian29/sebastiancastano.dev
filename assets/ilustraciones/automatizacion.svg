<svg xmlns="http://www.w3.org/2000/svg" id="ill-automatizacion" class="ill" viewBox="0 0 1200 800" role="img" aria-labelledby="ill-automatizacion-t ill-automatizacion-d">
<title id="ill-automatizacion-t">Engranajes y pájaro</title>
<desc id="ill-automatizacion-d">Unos engranajes giran a la izquierda; del último sale una línea que se desenrolla y se convierte en un pájaro que levanta el vuelo.</desc>
<defs>
<style>
#ill-automatizacion .l{fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#ill-automatizacion .f{stroke-width:1.05}
#ill-automatizacion .d{stroke-dasharray:1 3;animation:ill-automatizacion-draw var(--d,2s) cubic-bezier(.45,0,.2,1) var(--t,0s) both}
#ill-automatizacion .peso{stroke-width:2.7;animation:ill-automatizacion-fade 1.8s ease var(--t,0s) both}
#ill-automatizacion .ap{animation:ill-automatizacion-fade 1.4s ease var(--t,0s) both}
#ill-automatizacion .luz{fill:#fff;stroke:none}
#ill-automatizacion .mano{filter:url(#ill-automatizacion-tinta)}
#ill-automatizacion[data-trazo="hilo"] .mano{filter:url(#ill-automatizacion-hilo)}
#ill-automatizacion[data-trazo="hilo"] .l{stroke-width:1.2}
#ill-automatizacion[data-trazo="hilo"] .peso{display:none}
@keyframes ill-automatizacion-draw{from{stroke-dashoffset:1.15}to{stroke-dashoffset:0}}
@keyframes ill-automatizacion-fade{from{opacity:0}}
#ill-automatizacion .gira{animation:ill-automatizacion-gira var(--g) linear infinite}
#ill-automatizacion .ala{transform-origin:4px -3px;animation:ill-automatizacion-aleteo 1.5s ease-in-out 13.2s infinite alternate}
#ill-automatizacion .ala.b{transform-origin:12px -4px;animation-delay:13.32s}
#ill-automatizacion #auto-pajaro-vuelo{animation:ill-automatizacion-planea 6s ease-in-out 13.2s infinite alternate}
@keyframes ill-automatizacion-gira{to{transform:rotate(360deg)}}
@keyframes ill-automatizacion-aleteo{to{transform:scaleY(.12)}}
@keyframes ill-automatizacion-planea{to{transform:translate(1.5px,-3px)}}
#ill-automatizacion[data-state="espera"] *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){#ill-automatizacion *{animation:none!important}}
</style>
