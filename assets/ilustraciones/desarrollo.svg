<svg xmlns="http://www.w3.org/2000/svg" id="ill-desarrollo" class="ill" viewBox="0 0 1200 800" role="img" aria-labelledby="ill-desarrollo-t ill-desarrollo-d">
<title id="ill-desarrollo-t">Arquitecto en obra</title>
<desc id="ill-desarrollo-d">Una figura sobre un andamio coloca la última pieza de una estructura que es mitad edificio y mitad interfaz, precisa abajo y abocetada arriba.</desc>
<defs>
<style>
#ill-desarrollo .l{fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#ill-desarrollo .f{stroke-width:1.05}
#ill-desarrollo .d{stroke-dasharray:1 3;animation:ill-desarrollo-draw var(--d,2s) cubic-bezier(.45,0,.2,1) var(--t,0s) both}
#ill-desarrollo .peso{stroke-width:2.7;animation:ill-desarrollo-fade 1.8s ease var(--t,0s) both}
#ill-desarrollo .ap{animation:ill-desarrollo-fade 1.4s ease var(--t,0s) both}
#ill-desarrollo .luz{fill:#fff;stroke:none}
#ill-desarrollo .mano{filter:url(#ill-desarrollo-tinta)}
#ill-desarrollo[data-trazo="hilo"] .mano{filter:url(#ill-desarrollo-hilo)}
#ill-desarrollo[data-trazo="hilo"] .l{stroke-width:1.2}
#ill-desarrollo[data-trazo="hilo"] .peso{display:none}
@keyframes ill-desarrollo-draw{from{stroke-dashoffset:1.15}to{stroke-dashoffset:0}}
@keyframes ill-desarrollo-fade{from{opacity:0}}
#ill-desarrollo #dev-figura{transform-origin:474px 459px;animation:ill-desarrollo-coloca 9s cubic-bezier(.45,0,.2,1) 12.4s infinite backwards}
#ill-desarrollo #dev-cursor{animation:ill-desarrollo-cursor 1.1s steps(1) 11s infinite backwards}
#ill-desarrollo #dev-texto-3{animation:ill-desarrollo-draw 1.6s ease 9.6s both,ill-desarrollo-teclea 9s ease 12.4s infinite}
@keyframes ill-desarrollo-coloca{0%,100%{transform:rotate(-7deg)}38%,78%{transform:rotate(0)}}
@keyframes ill-desarrollo-cursor{0%{opacity:0}50%{opacity:1}}
@keyframes ill-desarrollo-teclea{0%,30%{stroke-dashoffset:1.15}55%,100%{stroke-dashoffset:0}}
#ill-desarrollo[data-state="espera"] *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){#ill-desarrollo *{animation:none!important}}
</style>
<filter id="ill-desarrollo-tinta" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="800">
<feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="1" seed="4" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
<feGaussianBlur stdDeviation="0.35"/>
</filter>
<filter id="ill-desarrollo-hilo" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="800">
<feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="1" seed="4"/>
<feDisplacementMap in="SourceGraphic" scale="4" xChannelSelector="R" yChannelSelector="G"/>
<feGaussianBlur stdDeviation="0.3"/>
</filter>
</defs>
